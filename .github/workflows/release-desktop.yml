name: Release Windows Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Publish WPF Application
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish Windows x64 application
        run: >-
          dotnet publish desktop/OCS.Desktop/OCS.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output artifacts/desktop/win-x64

      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -Path artifacts/desktop/win-x64/* -DestinationPath artifacts/OCS.Desktop-win-x64.zip

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: ocs-desktop-win-x64
          path: artifacts/OCS.Desktop-win-x64.zip

      - name: Attach archive to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/OCS.Desktop-win-x64.zip
          generate_release_notes: true
